eter<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildfire Map Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js"></script>
    <link rel="stylesheet" href="wildfire_theme.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .fire-marker {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.3; }
            100% { transform: scale(1); opacity: 1; }
        }
        .heat-overlay {
            background: radial-gradient(circle, rgba(255,0,0,0.3) 10%, transparent 70%);
            animation: heatRise 12s infinite;
        }
        @keyframes heatRise {
            0% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-20px); opacity: 0.2; }
            100% { transform: translateY(0); opacity: 0.6; }
        }
    </style>
</head>
<body class="bg-background text-foreground">
    <div class="container mx-auto p-4">
        <header class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center">
                    <span class="text-primary-foreground text-sm">🔥</span>
                </div>
                <h1 class="text-xl font-bold">Wildfire Map Dashboard</h1>
            </div>
            <div class="flex space-x-2">
                <button class="p-2 rounded-full hover:bg-accent hover:text-accent-foreground">
                    <i data-lucide="user"></i>
                </button>
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-accent hover:text-accent-foreground">
                    <i data-lucide="moon"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <aside class="lg:col-span-1">
                <div class="bg-card rounded-lg shadow-sm p-4 mb-6">
                    <h2 class="font-semibold mb-4">Legend</h2>
                    <div class="space-y-2">
                        <div class="flex items-center">
                            <span class="inline-block w-4 h-4 bg-destructive rounded-full mr-2"></span>
                            <span>Active Fire</span>
                        </div>
                        <div class="flex items-center">
                            <span class="inline-block w-4 h-4 bg-green-500 rounded-full mr-2"></span>
                            <span>Contained</span>
                        </div>
                        <div class="flex items-center">
                            <span class="inline-block w-4 h-4 bg-yellow-500 rounded-full mr-2"></span>
                            <span>Under Control</span>
                        </div>
                    </div>
                </div>

                <div class="bg-card rounded-lg shadow-sm p-4">
                    <h2 class="font-semibold mb-4">Filters</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm mb-1">Time Range</label>
                            <select class="w-full bg-input rounded border-border">
                                <option>Last 24h</option>
                                <option>Last 7d</option>
                                <option>Last 30d</option>
                                <option>Custom</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm mb-1">Severity</label>
                            <div class="flex space-x-2">
                                <button class="flex-1 py-1 px-2 bg-muted rounded text-xs">Low</button>
                                <button class="flex-1 py-1 px-2 bg-accent rounded text-xs">Medium</button>
                                <button class="flex-1 py-1 px-2 bg-destructive rounded text-xs">High</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm mb-1">Status</label>
                            <div class="space-y-2">
                                <div class="flex items-center">
                                    <input type="checkbox" id="active" class="mr-2">
                                    <label for="active">Active</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="contained" class="mr-2">
                                    <label for="contained">Contained</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="under-control" class="mr-2">
                                    <label for="under-control">Under Control</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="lg:col-span-3">
                <div class="bg-card rounded-lg shadow-sm overflow-hidden mb-6">
                    <div class="h-96 relative">
                        <div class="absolute inset-0 bg-[url('https://placehold.co/800x600/eee/999?text=Satellite+Map')] bg-cover bg-center">
                            <div class="absolute top-1/4 left-1/3 fire-marker bg-destructive rounded-full w-4 h-4"></div>
                            <div class="absolute top-1/2 left-1/2 fire-marker bg-destructive rounded-full w-6 h-6"></div>
                            <div class="absolute top-2/3 left-2/3 fire-marker bg-destructive rounded-full w-3 h-3"></div>
                        </div>
                        <div class="absolute top-4 right-4 bg-background/90 rounded-lg p-3 shadow-sm">
                            <div class="text-sm font-medium mb-2">Map Controls</div>
                            <div class="flex flex-col space-y-2">
                                <button class="p-2 hover:bg-accent hover:text-accent-foreground rounded">
                                    <i data-lucide="plus"></i>
                                </button>
                                <button class="p-2 hover:bg-accent hover:text-accent-foreground rounded">
                                    <i data-lucide="minus"></i>
                                </button>
                                <button class="p-2 hover:bg-accent hover:text-accent-foreground rounded">
                                    <i data-lucide="compass"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-card rounded-lg shadow-sm p-4">
                    <h2 class="font-semibold mb-4">Timeline</h2>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <button class="px-3 py-1 bg-muted rounded-full text-sm">24h</button>
                        <button class="px-3 py-1 bg-muted rounded-full text-sm">7d</button>
                        <button class="px-3 py-1 bg-muted rounded-full text-sm">30d</button>
                        <button class="px-3 py-1 bg-muted rounded-full text-sm">Custom</button>
                    </div>
                    <div class="h-4 bg-input rounded-full relative">
                        <div class="absolute top-0 left-0 h-full w-1/3 bg-primary rounded-full"></div>
                    </div>
                    <div class="flex justify-between text-xs mt-2">
                        <span>2023-10-15 00:00</span>
                        <span>2023-10-15 14:30</span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark');
            // Add theme toggle logic here
        });

        lucide.createIcons();
    </script>
</body>
</html>
