<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whitney High School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #f3f4f6;
            --dark: #1f2937;
        }

        .letter {
            display: inline-block;
            position: absolute;
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            transition: all 1s ease-in-out;
        }

        .container {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .home-page {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        .nav {
            background: var(--secondary);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: white;
        }

        .footer {
            background: var(--dark);
            color: white;
            padding: 1rem;
            text-align: center;
        }

        @keyframes letterMove {
            0% { opacity: 1; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.5; transform: scale(1.5) rotate(180deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
    </style>
</head>
<body class="bg-white">
    <div id="animation-container" class="container">
        <div id="title" class="text-5xl font-bold text-primary">
            WHITNEY HIGH SCHOOL
        </div>
        <button id="animate-btn" class="mt-8 px-6 py-2 bg-primary text-white rounded-full hover:bg-blue-700 transition">
            Enter School
        </button>
    </div>

    <div id="home-page" class="home-page">
        <div class="nav">
            <div class="text-2xl font-bold text-primary">WHS</div>
            <div class="space-x-4">
                <a href="#" class="text-dark hover:text-primary">Home</a>
                <a href="#" class="text-dark hover:text-primary">About</a>
                <a href="#" class="text-dark hover:text-primary">Contact</a>
            </div>
        </div>

        <div class="content">
            <h1 class="text-4xl font-bold text-center">Welcome to Whitney High School</h1>
        </div>

        <div class="footer">
            <p>&copy; 2023 Whitney High School. All rights reserved.</p>
        </div>
    </div>

    <script>
        const animateBtn = document.getElementById('animate-btn');
        const container = document.getElementById('animation-container');
        const homePage = document.getElementById('home-page');
        const title = document.getElementById('title');

        animateBtn.addEventListener('click', () => {
            // Create letter elements
            const text = title.textContent;
            title.style.display = 'none';
            animateBtn.style.display = 'none';
            
            // Create letter spans
            const letters = text.split('').map((char, i) => {
                const span = document.createElement('span');
                span.className = 'letter';
                span.textContent = char;
                span.style.left = `${i * 30}px`;
                span.style.top = '50%';
                span.style.transform = 'translateY(-50%)';
                container.appendChild(span);
                return span;
            });

            // Animate letters to form home page
            setTimeout(() => {
                letters.forEach((letter, i) => {
                    letter.style.left = `${window.innerWidth/2 - (text.length*15) + i*30}px`;
                    letter.style.top = '20px';
                    letter.style.fontSize = '1.5rem';
                    letter.style.color = 'white';
                    letter.style.animation = 'letterMove 2s infinite';
                });
            }, 500);

            // Show home page after animation
            setTimeout(() => {
                container.style.display = 'none';
                homePage.style.display = 'flex';
            }, 3000);
        });

        // Initialize lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
